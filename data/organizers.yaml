#
# Photos are picked up automatically from assets/images/organizers/ by first
# name, in any format: arian.jpg, artem.png, roger.webp all work. They are
# cropped to a square and resized at build time, so any size or aspect ratio is
# fine — no need to crop them first. Anyone without a photo gets a grey circle.
#
# Add `photo: "othername"` to an entry only when the file cannot be named after
# the lowercased first name.

