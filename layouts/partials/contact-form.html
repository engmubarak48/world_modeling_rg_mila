{{ $endpoint := site.Params.formEndpoint }}
{{ $thanks := "thanks/" | absURL }}
<form class="contact-form" action="{{ $endpoint }}" method="POST">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" autocomplete="name" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>
  </div>

  <input type="hidden" name="_subject" value="{{ site.Title }} — website enquiry">
  <input type="hidden" name="_captcha" value="false">
  {{ if hasPrefix $thanks "http" }}<input type="hidden" name="_next" value="{{ $thanks }}">{{ end }}
  <!-- Spam trap: real people leave this empty. -->
  <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

  <button type="submit">Send</button>
</form>
